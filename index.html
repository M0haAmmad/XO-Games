<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon XO | Battle Grid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <button id="muteBtn" onclick="toggleMute()"
        style="position:fixed; top:20px; right:20px; background:none; border:none; color:var(--ui-accents); font-size:1.5rem; cursor:pointer; z-index: 200;">
        <i class="fas fa-volume-up"></i>
    </button>


    <section id="setupScreen" class="screen">
        <h1 class="title">NEON TRIVIA XO</h1>
        <div class="setup-panel">
            <div class="input-group">
                <label>Player 1 Name</label>
                <input type="text" id="p1Input" value="Player 1">
            </div>
            <div class="input-group">
                <label>Player 2 Name</label>
                <input type="text" id="p2Input" value="Player 2">
            </div>

            <label style="color:#aaa; font-weight:bold;">Player 1 Plays As:</label>
            <div class="side-selector">
                <button class="side-btn selected" onclick="selectSide('X')">X</button>
                <button class="side-btn" onclick="selectSide('O')">O</button>
            </div>

            <button class="start-btn" onclick="startGame()">INITIATE</button>
        </div>
    </section>

    <!-- Game Screen -->
    <section id="gameScreen" class="screen hidden">
        <div class="scoreboard">
            <div class="player-score" id="p1ScoreBox">
                <span class="player-name" id="p1NameDisplay">P1</span>
                <span class="score-val" id="p1ScoreVal" style="color: var(--p1-color)">0</span>
            </div>
            <div style="font-size: 2rem; color: #555;">VS</div>
            <div class="player-score" id="p2ScoreBox">
                <span class="player-name" id="p2NameDisplay">P2</span>
                <span class="score-val" id="p2ScoreVal" style="color: var(--p2-color)">0</span>
            </div>
        </div>

        <div class="game-board" id="board">
            <div class="win-line" id="winLine"></div>

            <div class="cell" data-i="0"></div>
            <div class="cell" data-i="1"></div>
            <div class="cell" data-i="2"></div>
            <div class="cell" data-i="3"></div>
            <div class="cell" data-i="4"></div>
            <div class="cell" data-i="5"></div>
            <div class="cell" data-i="6"></div>
            <div class="cell" data-i="7"></div>
            <div class="cell" data-i="8"></div>
        </div>
    </section>


    <div class="modal-overlay" id="modal">
        <div class="modal-content" id="modalContent">

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
